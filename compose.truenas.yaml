# Mordhau dedicated server + web panel for TrueNAS.
# Install: Apps > Discover Apps > Custom App (⋮ menu) > Install via YAML.
# Full guide: https://github.com/infish/truenas-mordhau/blob/main/docs/INSTALL.md
name: mordhau

# Adds a "Web UI" button for the panel to the app in TrueNAS. TrueNAS replaces
# 0.0.0.0 with the address you use to open TrueNAS.
x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 37080
    path: /

services:
  server:
    image: docker.io/infish1997/mordhau-server:latest
    container_name: mordhau
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      # Your time zone, e.g. Europe/London or America/New_York.
      TZ: Europe/Prague

      # Steam/install behavior.
      UPDATE_ON_START: "true"
      STEAM_VALIDATE: "false"
      STEAM_BRANCH: ""

      # The server waits for the panel's setup screen before its first start.
      # Server name, passwords, max players and maps are set in the panel.
      # (The older SERVER_NAME, SERVER_PASSWORD, ADMIN_PASSWORD, MAX_PLAYERS,
      # ADVERTISE_SERVER, DEFAULT_MAP and MAP_ROTATION variables still work as
      # defaults; values saved in the panel take precedence.)
      WAIT_FOR_SETUP: "true"

      # Mordhau ports inside the container.
      GAME_PORT: "37000"
      BEACON_PORT: "37002"
      QUERY_PORT: "37003"
      RCON_PORT: "37001"

    volumes:
      - type: bind
        # CHANGE THIS to your dataset path (the same in both services).
        source: /mnt/Apps/MordhauServer
        target: /data

    # The RCON port (37001) is not published: the panel reaches it over the
    # app's internal network, so it never needs to be open on your LAN.
    ports:
      - target: 37000
        published: 37000
        protocol: tcp
      - target: 37000
        published: 37000
        protocol: udp
      - target: 37002
        published: 37002
        protocol: tcp
      - target: 37002
        published: 37002
        protocol: udp
      - target: 37003
        published: 37003
        protocol: tcp
      - target: 37003
        published: 37003
        protocol: udp

    security_opt:
      - no-new-privileges:true

  panel:
    image: docker.io/infish1997/mordhau-panel:latest
    container_name: mordhau-panel
    restart: unless-stopped
    environment:
      TZ: Europe/Prague
      # The panel password is set on the setup screen, and the RCON password
      # is generated and shared with the server automatically. Setting
      # PANEL_PASSWORD or RCON_PASSWORD here overrides that.
    volumes:
      - type: bind
        # CHANGE THIS to your dataset path (the same in both services).
        source: /mnt/Apps/MordhauServer
        target: /data
    ports:
      - target: 8080
        published: 37080
        protocol: tcp
    security_opt:
      - no-new-privileges:true

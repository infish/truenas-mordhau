name: mordhau

services:
  server:
    image: docker.io/infish1997/mordhau-server:latest
    container_name: mordhau
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      TZ: Europe/Prague

      # Steam/install behavior.
      UPDATE_ON_START: "true"
      STEAM_VALIDATE: "false"
      STEAM_BRANCH: ""

      # These are applied when config/Game.ini and config/Engine.ini are first
      # created. Set APPLY_ENV_ON_START to "true" for one redeploy if you want
      # compose values to overwrite config files again.
      APPLY_ENV_ON_START: "false"
      SERVER_NAME: "Home Mordhau"
      SERVER_PASSWORD: ""
      ADMIN_PASSWORD: "CHANGE_ME_LONG_RANDOM_PASSWORD"
      # Required by the panel. Use the same value in the panel service below.
      RCON_PASSWORD: "CHANGE_ME_RCON_PASSWORD"
      MAX_PLAYERS: "16"
      ADVERTISE_SERVER: "false"
      # Defaults only: rotation saved from the panel takes precedence.
      # MAP_ROTATION is comma-separated with no length limit; the older
      # MAP_ROTATION_1, MAP_ROTATION_2, ... form also still works.
      DEFAULT_MAP: "FFA_ThePit"
      MAP_ROTATION: "FFA_ThePit,FFA_Camp,TDM_Camp"

      # Mordhau ports.
      GAME_PORT: "37000"
      BEACON_PORT: "37002"
      QUERY_PORT: "37003"
      RCON_PORT: "37001"

    volumes:
      - type: bind
        source: /mnt/Apps/MordhauServer
        target: /data

    ports:
      - target: 37000
        published: 37000
        protocol: tcp
      - target: 37000
        published: 37000
        protocol: udp
      - target: 37001
        published: 37001
        protocol: tcp
      - target: 37001
        published: 37001
        protocol: udp
      - target: 37002
        published: 37002
        protocol: tcp
      - target: 37002
        published: 37002
        protocol: udp
      - target: 37003
        published: 37003
        protocol: tcp
      - target: 37003
        published: 37003
        protocol: udp

    security_opt:
      - no-new-privileges:true

  panel:
    image: docker.io/infish1997/mordhau-panel:latest
    container_name: mordhau-panel
    restart: unless-stopped
    environment:
      TZ: Europe/Prague
      PANEL_USERNAME: "admin"
      PANEL_PASSWORD: "CHANGE_ME_PANEL_PASSWORD"
      RCON_PASSWORD: "CHANGE_ME_RCON_PASSWORD"
      RCON_HOST: "server"
      RCON_PORT: "37001"
      QUERY_HOST: "server"
      QUERY_PORT: "37003"
    volumes:
      - type: bind
        source: /mnt/Apps/MordhauServer
        target: /data
    ports:
      - target: 8080
        published: 37080
        protocol: tcp
    security_opt:
      - no-new-privileges:true

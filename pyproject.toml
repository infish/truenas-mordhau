[project]
name = "mordhau-panel"
version = "0.1.0"
description = "Web panel for the Mordhau dedicated server: live map changes over RCON and rotation editing."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["panel/mordhau_panel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["panel"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
